<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fields, proposed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#003f7e;text-decoration:none}a:hover{color:#004c97}
</style>
</helmet>
<div style="position: relative; width: 1040px; height: 420px; padding: 40px 48px; display: flex; flex-direction: column; gap: 32px; background: #ffffff; color: #2d3943; font-family: 'Nunito Sans', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">
<section style="display: flex; flex-direction: column; gap: 12px;">
<h2 style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 600; color: #64727e;">Text input: focused, read-only, invalid</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: start;">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
<label for="fn-name" style="width: fit-content; font-size: 12px; line-height: 16px; font-weight: 500; color: #64727e;">Name</label>
<input id="fn-name" type="text" value="Harbor Street Credit Union" style="width: 100%; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(0,51,101,0.12); background: rgba(0,51,101,0.04); font-family: inherit; font-size: 14px; color: #1c2733; border-color: #004c97; background: #ffffff; box-shadow: 0 0 0 3px rgba(0,76,151,0.14); outline: 0;">
<p style="margin: 0; font-size: 12px; line-height: 16px; color: #64727e;">Shown in the tenant switcher.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
<label for="fn-slug" style="width: fit-content; font-size: 12px; line-height: 16px; font-weight: 500; color: #64727e;">Slug</label>
<input id="fn-slug" type="text" value="harbor-street" readonly="readonly" style="width: 100%; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(0,51,101,0.12); background: rgba(0,51,101,0.04); font-family: inherit; font-size: 14px; color: #1c2733; border-color: transparent; color: #64727e;">
<p style="margin: 0; font-size: 12px; line-height: 16px; color: #64727e;">Fixed after the tenant is created.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
<label for="fn-source" style="width: fit-content; font-size: 12px; line-height: 16px; font-weight: 500; color: #64727e; color: oklch(50.5% 0.213 27.518);">Source name</label>
<input id="fn-source" type="text" aria-invalid="true" aria-describedby="fn-source-err" placeholder="Loan servicing API" style="width: 100%; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(0,51,101,0.12); background: rgba(0,51,101,0.04); font-family: inherit; font-size: 14px; color: #1c2733; border-color: oklch(57.7% 0.245 27.325); background: #ffffff;">
<p id="fn-source-err" style="margin: 0; font-size: 12px; line-height: 16px; color: #64727e; display: flex; align-items: center; gap: 6px; font-weight: 500; color: oklch(50.5% 0.213 27.518);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4.5M12 17.5v.01"/></svg><span>Give the source a name.</span></p>
</div>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 12px;">
<h2 style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 600; color: #64727e;">Select, search with clear, textarea</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: start;">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
<label for="fn-status" style="width: fit-content; font-size: 12px; line-height: 16px; font-weight: 500; color: #64727e;">Status</label>
<span style="position: relative; display: flex; align-items: center; color: #1c2733;">
<select id="fn-status" style="width: 100%; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(0,51,101,0.12); background: rgba(0,51,101,0.04); font-family: inherit; font-size: 14px; color: #1c2733; appearance: none; -webkit-appearance: none;"><option selected="selected">Active</option><option>Pending</option><option>Suspended</option></select>
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="position: absolute; right: 8px; pointer-events: none;"><path d="M7 10h10l-5 6z"/></svg>
</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
<label for="fn-find" style="width: fit-content; font-size: 12px; line-height: 16px; font-weight: 500; color: #64727e;">Find a tenant</label>
<span style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 4px 0 12px; border-radius: 8px; border: 1px solid rgba(0,51,101,0.12); background: rgba(0,51,101,0.04);">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64727e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
<input id="fn-find" type="text" value="harbor" style="flex: 1 1 auto; min-width: 0; height: 100%; padding: 0; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; color: #1c2733;">
<button type="button" aria-label="Clear" style="display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; padding: 0; border: 0; cursor: pointer; width: 32px; height: 32px; border-radius: 9999px; background: transparent; color: #64727e;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
<label for="fn-note" style="width: fit-content; font-size: 12px; line-height: 16px; font-weight: 500; color: #64727e;">Note to the requester</label>
<textarea id="fn-note" rows="4" placeholder="What needs to change?" style="display: block; width: 100%; height: 96px; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(0,51,101,0.12); background: rgba(0,51,101,0.04); resize: none; font-family: inherit; font-size: 14px; line-height: 1.5; color: #1c2733;"></textarea>
</div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":420}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
