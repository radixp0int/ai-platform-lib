<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap">

body{margin:0}

<div style="position: relative; width: 1040px; height: 300px; padding: 40px 48px; display: flex; flex-direction: column; gap: 32px; background: #ffffff; color: #2d3943; font-family: 'Nunito Sans', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">
<section style="display: flex; flex-direction: column; gap: 12px;">

<div style="display: flex; align-items: center; min-height: 44px;">
<div role="tablist" aria-label="Task lists" style="display: flex; align-items: flex-end; gap: 28px; width: 100%; border-bottom: 1px solid rgba(0,51,101,0.12);">
<button type="button" role="tab" aria-selected="true" style="display: inline-flex; align-items: center; flex: 0 0 auto; border: 0; font-family: inherit; white-space: nowrap; cursor: pointer; gap: 8px; height: 44px; margin-bottom: -1px; padding: 0; background: transparent; box-shadow: inset 0 -2px 0 #1c2733; font-size: 14px; font-weight: 600; color: #1c2733;"><span>Waiting on you</span><span style="font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; color: #64727e;">2</span></button>
<button type="button" role="tab" aria-selected="false" style="display: inline-flex; align-items: center; flex: 0 0 auto; border: 0; font-family: inherit; white-space: nowrap; cursor: pointer; gap: 8px; height: 44px; margin-bottom: -1px; padding: 0; background: transparent; font-size: 14px; font-weight: 400; color: #64727e;"><span>Done</span><span style="font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; color: #64727e;">5</span></button>
<button type="button" role="tab" aria-selected="false" style="display: inline-flex; align-items: center; flex: 0 0 auto; border: 0; font-family: inherit; white-space: nowrap; cursor: pointer; gap: 8px; height: 44px; margin-bottom: -1px; padding: 0; background: transparent; font-size: 14px; font-weight: 400; color: #64727e;"><span>Sent back</span></button>
</div>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 12px;">
<h2 style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 600; color: #64727e;">Chips, replacing segmented</h2>
<div style="display: flex; align-items: center; min-height: 44px;">
<div role="tablist" aria-label="Recent activity" style="display: flex; align-items: center; gap: 8px;"><button type="button" role="tab" aria-selected="true" style="display: inline-flex; align-items: center; flex: 0 0 auto; border: 0; font-family: inherit; white-space: nowrap; cursor: pointer; height: 36px; padding: 0 14px; border-radius: 8px; font-size: 14px; border: 1px solid transparent; background: rgba(0,51,101,0.08); font-weight: 600; color: #1c2733;">Recent</button><button type="button" role="tab" aria-selected="false" style="display: inline-flex; align-items: center; flex: 0 0 auto; border: 0; font-family: inherit; white-space: nowrap; cursor: pointer; height: 36px; padding: 0 14px; border-radius: 8px; font-size: 14px; border: 1px solid rgba(0,51,101,0.16); background: #ffffff; font-weight: 500; color: #2d3943;">Conversations</button><button type="button" role="tab" aria-selected="false" style="display: inline-flex; align-items: center; flex: 0 0 auto; border: 0; font-family: inherit; white-space: nowrap; cursor: pointer; height: 36px; padding: 0 14px; border-radius: 8px; font-size: 14px; border: 1px solid rgba(0,51,101,0.16); background: #ffffff; font-weight: 500; color: #2d3943;">Runs</button></div>
</div>
</section>
</div>
