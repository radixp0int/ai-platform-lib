<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wizard — side menu hidden</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#003f7e;text-decoration:none}a:hover{color:#004c97}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; display: flex; flex-direction: column; background: #f5f7f9; color: #2d3943; font-family: 'Nunito Sans', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">

  <header style="display: flex; align-items: center; height: 60px; flex: 0 0 auto; padding: 0 12px 0 10px; background: #002a52; color: #ffffff;">
    <a href="Main.dc.html" aria-label="Exit and go back" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 7px; color: #d9e6f5;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
    </a>
    <a href="Main.dc.html" aria-label="Acme, go to Home" style="display: flex; align-items: center; gap: 10px; height: 44px; margin-left: 10px; padding: 0 8px; border-radius: 7px; color: #ffffff;">
      <span aria-hidden="true" style="display: block; width: 24px; height: 24px; flex: 0 0 auto; border-radius: 9999px; background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 34%), radial-gradient(circle at 70% 25%, #ffb27a 0%, rgba(255,178,122,0) 45%), radial-gradient(circle at 28% 70%, #ef6a00 0%, rgba(239,106,0,0) 55%), radial-gradient(circle at 75% 78%, #0069aa 0%, rgba(0,105,170,0) 62%), radial-gradient(circle at 50% 50%, #7dabdb 0%, #004c97 78%); box-shadow: inset 0 -3px 6px rgba(0,25,50,0.35), inset 0 2px 4px rgba(255,255,255,0.5);"></span>
      <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em; color: #ffffff;">Acme</span>
    </a>
    <span aria-hidden="true" style="width: 1px; height: 24px; margin: 0 12px; background: rgba(255,255,255,0.20);"></span>
    <span style="padding: 0 8px; font-size: 14px; font-weight: 600; color: #d9e6f5;">Ingestion  ›  Add a source</span>
    <span style="flex: 1 1 auto;"></span>
    <a href="TenantSwitcher.dc.html" aria-label="Switch tenant. Current tenant: Alderfinch Treasury" style="display: flex; align-items: center; gap: 10px; width: 256px; height: 44px; margin: 0 4px; padding: 0 10px 0 8px; border-radius: 7px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.20); color: #ffffff;">
      <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex: 0 0 auto; border-radius: 6px; background: #ffffff; color: #002a52; font-size: 11px; font-weight: 700;">AT</span>
      <span style="flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Alderfinch Treasury</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d9e6f5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </a>
    <button type="button" aria-label="Help" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; border-radius: 7px; background: transparent; color: #d9e6f5; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M9.6 9.5a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2 1-1.2 1.8"></path><path d="M12 16.6h.01"></path></svg>
    </button>
    <button type="button" aria-label="Account: John Ozzo" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer;">
      <span style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9999px; background: #eef4fb; font-family: 'Nunito Sans', ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 700; color: #002a52;">JO</span>
    </button>
  </header>

  <div style="display: flex; flex: 1 1 auto; min-height: 0;">

    <main style="display: flex; flex-direction: column; align-items: center; flex: 1 1 auto; min-width: 0; padding: 40px 24px 0 24px;">
      <div style="display: flex; flex-direction: column; gap: 28px; width: 100%; max-width: 760px;">

        <ol aria-label="Progress" style="display: flex; align-items: center; gap: 14px; margin: 0; padding: 0; list-style: none;">
          <li aria-current="step" style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: #1c2733;"><span style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex: 0 0 auto; border-radius: 9999px; font-size: 13px; font-weight: 700; background: #004c97; color: #ffffff;">1</span><span>Source</span></li>
          <span aria-hidden="true" style="flex: 1 1 auto; height: 1px; background: rgba(0,51,101,0.20);"></span>
          <li style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: #64727e;"><span style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex: 0 0 auto; border-radius: 9999px; font-size: 13px; font-weight: 700; background: #ffffff; border: 1px solid rgba(0,51,101,0.28); color: #64727e;">2</span><span>Connect</span></li>
          <span aria-hidden="true" style="flex: 1 1 auto; height: 1px; background: rgba(0,51,101,0.20);"></span>
          <li style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: #64727e;"><span style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex: 0 0 auto; border-radius: 9999px; font-size: 13px; font-weight: 700; background: #ffffff; border: 1px solid rgba(0,51,101,0.28); color: #64727e;">3</span><span>Schedule</span></li>
          <span aria-hidden="true" style="flex: 1 1 auto; height: 1px; background: rgba(0,51,101,0.20);"></span>
          <li style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: #64727e;"><span style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex: 0 0 auto; border-radius: 9999px; font-size: 13px; font-weight: 700; background: #ffffff; border: 1px solid rgba(0,51,101,0.28); color: #64727e;">4</span><span>Review</span></li>
        </ol>

        <div style="display: flex; flex-direction: column; padding: 32px; border-radius: 10px; background: #ffffff; border: 1px solid rgba(0,51,101,0.12); box-shadow: 0 1px 2px rgba(0,25,50,0.04);">
          <h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.25; letter-spacing: -0.015em; color: #1c2733;">What do you want to add?</h1>
          <p style="margin: 8px 0 0 0; font-size: 15px; line-height: 1.55; color: #64727e;">The source is ingested into Alderfinch Treasury only. Other tenants never see it.</p>

          <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 24px;">
            <label for="source-api" style="display: flex; align-items: flex-start; gap: 14px; padding: 18px 20px; border-radius: 10px; cursor: pointer; background: rgba(0,76,151,0.05); border: 2px solid #004c97;">
              <input id="source-api" type="radio" name="source" checked="checked" style="width: 18px; height: 18px; margin: 2px 0 0 0; accent-color: #004c97;">
              <span style="display: flex; flex-direction: column; gap: 2px;">
                <span style="font-size: 15px; font-weight: 700; color: #1c2733;">Connect an API</span>
                <span style="font-size: 14px; line-height: 1.5; color: #64727e;">Pull records from another system on a schedule.</span>
              </span>
            </label>
            <label for="source-docs" style="display: flex; align-items: flex-start; gap: 14px; padding: 18px 20px; border-radius: 10px; cursor: pointer; background: #ffffff; border: 2px solid rgba(0,51,101,0.14);">
              <input id="source-docs" type="radio" name="source" style="width: 18px; height: 18px; margin: 2px 0 0 0; accent-color: #004c97;">
              <span style="display: flex; flex-direction: column; gap: 2px;">
                <span style="font-size: 15px; font-weight: 700; color: #1c2733;">Upload documents</span>
                <span style="font-size: 14px; line-height: 1.5; color: #64727e;">Add files from your computer.</span>
              </span>
            </label>
          </div>

          <div style="display: flex; align-items: center; gap: 12px; margin-top: 28px; padding-top: 20px; border-top: 1px solid rgba(0,51,101,0.12);">
            <a href="Main.dc.html" style="display: flex; align-items: center; height: 44px; font-size: 14px; font-weight: 600; color: #003f7e;">Cancel</a>
            <span style="flex: 1 1 auto;"></span>
            <button type="button" style="display: flex; align-items: center; justify-content: center; height: 44px; padding: 0 22px; border: 0; border-radius: 7px; background: #004c97; font-family: inherit; font-size: 14px; font-weight: 700; color: #ffffff; cursor: pointer;">Continue</button>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
