<html lang="en">
<head>
<meta charset="utf-8">

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#003f7e;text-decoration:none}a:hover{color:#004c97}
</style>
</helmet>
<div style="position: relative; width: 1040px; height: 560px; display: flex; align-items: center; justify-content: center; background: #8c98a3; color: #2d3943; font-family: 'Nunito Sans', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">
<div role="dialog" aria-modal="true" aria-labelledby="mt-title" aria-describedby="mt-desc" style="position: relative; display: flex; flex-direction: column; width: 512px; overflow: hidden; border-radius: 14px; border: 1px solid rgba(0,51,101,0.10); background: #ffffff; box-shadow: 0 25px 50px -12px rgba(0,25,50,0.25);">
<header style="display: flex; align-items: flex-start; gap: 12px; padding: 20px 20px 12px 20px;">
<span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex: 0 0 auto; border-radius: 7px; background: rgba(0,76,151,0.10); box-shadow: 0 0 0 1px rgba(0,105,170,0.15); color: #0069aa;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></span>
<div style="flex: 1 1 auto; min-width: 0; padding-right: 32px;">
<h2 id="mt-title" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 800; letter-spacing: -0.025em; color: #1c2733;">Send back Commercial loan review?</h2>
<p id="mt-desc" style="margin: 4px 0 0 0; font-size: 13px; line-height: 1.625; color: #64727e;">It returns to the requester with your note.</p>
</div>
<button type="button" aria-label="Close dialog" style="display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; padding: 0; border: 0; cursor: pointer; position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 9999px; background: transparent; color: #64727e;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
</header>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 4px 20px 20px 20px;">
<label for="mt-note" style="width: fit-content; font-size: 12.5px; line-height: 18px; font-weight: 700; color: #1c2733;">Note to the requester</label>
<textarea id="mt-note" rows="4" placeholder="What needs to change?" style="display: block; width: 100%; height: 96px; padding: 8px 12px; border-radius: 7px; border: 1px solid rgba(0,51,101,0.10); background: #ffffff; resize: none; font-family: inherit; font-size: 13px; line-height: 1.625; color: #2d3943;"></textarea>
</div>
<footer style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 16px 20px; border-top: 1px solid rgba(0,51,101,0.10); background: rgba(0,76,151,0.03);">
<button type="button" style="display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; font-family: inherit; white-space: nowrap; cursor: pointer; border-radius: 7px; font-weight: 700; height: 36px; padding: 0 16px; gap: 8px; font-size: 13px; border: 1px solid rgba(0,51,101,0.10); background: #ffffff; color: #2d3943;"><span>Cancel</span></button>
<button type="button" style="display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; font-family: inherit; white-space: nowrap; cursor: pointer; border-radius: 7px; font-weight: 700; height: 36px; padding: 0 16px; gap: 8px; font-size: 13px; border: 0; background: #004c97; color: #ffffff;"><span>Send back</span></button>
</footer>
</div>
</div>
</x-dc>

</html>
