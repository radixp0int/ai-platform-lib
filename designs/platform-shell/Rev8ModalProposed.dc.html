<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#003f7e;text-decoration:none}a:hover{color:#004c97}
</style>

<div style="position: relative; width: 1040px; height: 560px; display: flex; align-items: center; justify-content: center; background: #8c98a3; color: #2d3943; font-family: 'Nunito Sans', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">
<div role="dialog" aria-modal="true" aria-labelledby="mn-title" aria-describedby="mn-desc" style="position: relative; display: flex; flex-direction: column; width: 512px; padding: 24px; border-radius: 12px; background: #ffffff; box-shadow: 0 24px 60px rgba(0,25,50,0.22), 0 2px 6px rgba(0,25,50,0.06);">
<header style="padding-right: 40px;">
<h2 id="mn-title" style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 400; letter-spacing: -0.01em; color: #1c2733;">Send back Commercial loan review?</h2>
<p id="mn-desc" style="margin: 6px 0 0 0; font-size: 14px; line-height: 1.5; color: #64727e;">It returns to the requester with your note.</p>
</header>
<button type="button" aria-label="Close dialog" style="display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; padding: 0; border: 0; cursor: pointer; position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 9999px; background: transparent; color: #64727e;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 20px;">
<label for="mn-note" style="width: fit-content; font-size: 12px; line-height: 16px; font-weight: 500; color: #64727e;">Note to the requester</label>
<textarea id="mn-note" rows="4" placeholder="What needs to change?" style="display: block; width: 100%; height: 96px; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(0,51,101,0.12); background: rgba(0,51,101,0.04); resize: none; font-family: inherit; font-size: 14px; line-height: 1.5; color: #1c2733;"></textarea>
</div>
<footer style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 24px;">
<button type="button" style="display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; font-family: inherit; white-space: nowrap; cursor: pointer; border-radius: 9999px; font-weight: 600; height: 44px; padding: 0 22px; gap: 8px; font-size: 14px; border: 0; background: rgba(0,76,151,0.08); color: #004c97; height: 40px;"><span>Cancel</span></button>
<button type="button" style="display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; font-family: inherit; white-space: nowrap; cursor: pointer; border-radius: 9999px; font-weight: 600; height: 44px; padding: 0 22px; gap: 8px; font-size: 14px; border: 0; background: #004c97; color: #ffffff; height: 40px;"><span>Send back</span></button>
</footer>
</div>
</div>
