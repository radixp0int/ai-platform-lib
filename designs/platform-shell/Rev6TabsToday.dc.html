<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tabs, today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#003f7e;text-decoration:none}a:hover{color:#004c97}
</style>
</helmet>
<div style="position: relative; width: 1040px; height: 300px; padding: 40px 48px; display: flex; flex-direction: column; gap: 32px; background: #ffffff; color: #2d3943; font-family: 'Nunito Sans', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased;">
<section style="display: flex; flex-direction: column; gap: 12px;">
<h2 style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 600; color: #64727e;">Line</h2>
<div style="display: flex; align-items: center; min-height: 44px;">
<div role="tablist" aria-label="Task lists" style="display: flex; align-items: flex-end; gap: 24px; width: 100%; border-bottom: 1px solid rgba(0,51,101,0.10);">
<button type="button" role="tab" aria-selected="true" style="display: inline-flex; align-items: center; flex: 0 0 auto; border: 0; font-family: inherit; white-space: nowrap; cursor: pointer; position: relative; gap: 8px; height: 44px; margin-bottom: -1px; padding: 0 2px; background: transparent; font-size: 13.5px; font-weight: 800; color: #1c2733;"><span>Waiting on you</span><span style="display: inline-flex; align-items: center; justify-content: center; height: 18px; min-width: 20px; padding: 0 6px; border-radius: 9999px; font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums; background: rgba(0,76,151,0.10); color: #004c97;">2</span><span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: #0069aa;"></span></button>
<button type="button" role="tab" aria-selected="false" style="display: inline-flex; align-items: center; flex: 0 0 auto; border: 0; font-family: inherit; white-space: nowrap; cursor: pointer; gap: 8px; height: 44px; margin-bottom: -1px; padding: 0 2px; background: transparent; font-size: 13.5px; font-weight: 600; color: #64727e;"><span>Done</span><span style="display: inline-flex; align-items: center; justify-content: center; height: 18px; min-width: 20px; padding: 0 6px; border-radius: 9999px; font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums; background: rgba(0,76,151,0.06); color: #64727e;">5</span></button>
<button type="button" role="tab" aria-selected="false" style="display: inline-flex; align-items: center; flex: 0 0 auto; border: 0; font-family: inherit; white-space: nowrap; cursor: pointer; gap: 8px; height: 44px; margin-bottom: -1px; padding: 0 2px; background: transparent; font-size: 13.5px; font-weight: 600; color: #64727e;"><span>Sent back</span></button>
</div>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 12px;">
<h2 style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 600; color: #64727e;">Segmented</h2>
<div style="display: flex; align-items: center; min-height: 44px;">
<div role="tablist" aria-label="Recent activity" style="display: inline-flex; align-items: center; gap: 2px; padding: 4px; border-radius: 10px; border: 1px solid rgba(0,51,101,0.10); background: rgba(0,76,151,0.10);"><button type="button" role="tab" aria-selected="true" style="display: inline-flex; align-items: center; flex: 0 0 auto; border: 0; font-family: inherit; white-space: nowrap; cursor: pointer; min-height: 32px; padding: 0 14px; border-radius: 7px; font-size: 13.5px; background: #ffffff; box-shadow: 0 1px 2px rgba(0,76,151,0.08); font-weight: 800; color: #1c2733;">Recent</button><button type="button" role="tab" aria-selected="false" style="display: inline-flex; align-items: center; flex: 0 0 auto; border: 0; font-family: inherit; white-space: nowrap; cursor: pointer; min-height: 32px; padding: 0 14px; border-radius: 7px; font-size: 13.5px; background: transparent; font-weight: 600; color: #64727e;">Conversations</button><button type="button" role="tab" aria-selected="false" style="display: inline-flex; align-items: center; flex: 0 0 auto; border: 0; font-family: inherit; white-space: nowrap; cursor: pointer; min-height: 32px; padding: 0 14px; border-radius: 7px; font-size: 13.5px; background: transparent; font-weight: 600; color: #64727e;">Runs</button></div>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":300}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
